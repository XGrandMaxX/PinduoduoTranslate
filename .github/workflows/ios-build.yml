name: Check iPhone build
on:
  workflow_dispatch:
  push:
    paths:
      - 'App/**'
      - 'BrowserResources/**'
      - 'tests/**'
      - 'scripts/**'
      - 'BroadcastExtension/**'
      - 'Shared/**'
      - 'Config/**'
      - 'project.yml'
      - '.github/workflows/ios-build.yml'
permissions:
  contents: read
concurrency:
  group: iphone-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix build/test-deps --no-audit --no-fund --ignore-scripts jsdom@26.1.0
      - run: NODE_PATH=build/test-deps/node_modules node --test tests/browser_translation.test.cjs
  unsigned-build:
    needs: browser-tests
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        scheme: [PinduoTranslate, PinduoTranslate27]
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      APP_SCHEME: ${{ matrix.scheme }}
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Check configuration
        run: |
          python3 scripts/check_project.py
          python3 scripts/check_secrets.py
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for a physical iPhone without signing
        shell: bash
        run: |
          mkdir -p build
          xcodebuild -version
          if ! xcodebuild \
            -project PinduoTranslate.xcodeproj \
            -scheme "$APP_SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build > build/xcodebuild.log 2>&1; then
            python3 - <<'PY'
          import re
          from pathlib import Path
          lines = Path('build/xcodebuild.log').read_text(errors='replace').splitlines()
          for line in [s for s in lines if re.search(r'error:|fatal error:|BUILD FAILED', s)][-30:]:
              print(line[:1200])
          PY
            tail -n 70 build/xcodebuild.log
            exit 1
          fi
          tail -n 8 build/xcodebuild.log
      - name: Package unsigned app for inspection
        run: |
          app_path="build/DerivedData/Build/Products/Debug-iphoneos/$APP_SCHEME.app"
          ditto -c -k --keepParent "$app_path" "build/$APP_SCHEME-UNSIGNED.app.zip"
          mkdir -p build/Payload
          cp -R "$app_path" build/Payload/
          ditto -c -k --keepParent build/Payload "build/$APP_SCHEME-UNSIGNED.ipa"
      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log-${{ matrix.scheme }}
          path: build/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Save unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app-${{ matrix.scheme }}
          path: |
            build/${{ matrix.scheme }}-UNSIGNED.app.zip
            build/${{ matrix.scheme }}-UNSIGNED.ipa
          retention-days: 7

name: Check iPhone build
on:
  workflow_dispatch:
  push:
    paths:
      - 'App/**'
      - 'BroadcastExtension/**'
      - 'Shared/**'
      - 'Config/**'
      - 'project.yml'
      - '.github/workflows/ios-build.yml'
permissions:
  contents: read
concurrency:
  group: iphone-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unsigned-build:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Check configuration
        run: |
          python3 scripts/check_project.py
          python3 scripts/check_secrets.py
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for a physical iPhone without signing
        shell: bash
        run: |
          mkdir -p build
          xcodebuild -version
          if ! xcodebuild \
            -project PinduoTranslate.xcodeproj \
            -scheme PinduoTranslate \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build > build/xcodebuild.log 2>&1; then
            python3 - <<'PY'
          import re
          from pathlib import Path
          lines = Path('build/xcodebuild.log').read_text(errors='replace').splitlines()
          for line in [s for s in lines if re.search(r'error:|fatal error:|BUILD FAILED', s)][-30:]:
              print(line[:1200])
          PY
            tail -n 70 build/xcodebuild.log
            exit 1
          fi
          tail -n 8 build/xcodebuild.log
      - name: Package unsigned app for inspection
        run: |
          ditto -c -k --keepParent \
            build/DerivedData/Build/Products/Debug-iphoneos/PinduoTranslate.app \
            build/PinduoTranslate-UNSIGNED.app.zip
      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: build/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Save unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app-not-installable
          path: build/PinduoTranslate-UNSIGNED.app.zip
          retention-days: 7

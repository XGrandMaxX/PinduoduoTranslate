name: PinduoTranslate
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: targeted
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
configFiles:
  Debug: Config/Build.xcconfig
  Release: Config/Build.xcconfig
targets:
  PinduoTranslate:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX)
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: ScreenBroadcast
        embed: true
      - sdk: AVKit.framework
      - sdk: Translation.framework
      - sdk: ReplayKit.framework
      - sdk: ScreenCaptureKit.framework
      - sdk: Vision.framework
  ScreenBroadcast:
    type: app-extension
    platform: iOS
    sources: [BroadcastExtension, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).broadcast
        INFOPLIST_FILE: Config/Broadcast-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Broadcast.entitlements
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: ReplayKit.framework
      - sdk: Vision.framework
schemes:
  PinduoTranslate:
    build:
      targets:
        PinduoTranslate: all
    run:
      config: Debug
    archive:
      config: Release

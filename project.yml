name: PinduoTranslate
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: targeted
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.4.0'
    CURRENT_PROJECT_VERSION: '4'
configFiles:
  Debug: Config/Build.xcconfig
  Release: Config/Build.xcconfig
targets:
  PinduoTranslate27:
    type: application
    platform: iOS
    deploymentTarget: '27.0'
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).standalone27
        INFOPLIST_FILE: Config/App27-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: '27.0'
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: Security.framework
      - sdk: CryptoKit.framework
  PinduoTranslate:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX)
        INFOPLIST_FILE: Config/App-Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: Security.framework
      - sdk: CryptoKit.framework
schemes:
  PinduoTranslate27:
    build:
      targets:
        PinduoTranslate27: all
    run:
      config: Debug
    archive:
      config: Release
  PinduoTranslate:
    build:
      targets:
        PinduoTranslate: all
    run:
      config: Debug
    archive:
      config: Release
